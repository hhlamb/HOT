# ============================================================
# 项目配置（抓取 / 清洗 / 摘要 / 保留策略）
# 改这里不需要动代码
# ============================================================

site:
  title: 跨境母婴 · 奶粉行业资讯
  subtitle: 品牌动态 / 政策法规 / 供应链 / 跨境电商
  # 部署到 GitHub Pages 后填真实地址，用于 canonical 与分享
  url: ""

fetch:
  timeout_seconds: 20          # 单次请求超时
  retries: 2                   # 失败重试次数（不含首次）
  concurrency: 6               # 全局并发上限
  min_delay_seconds: 1.5       # 同一域名两次请求的最小间隔
  max_delay_seconds: 3.0       # 间隔随机上限（打散节奏，降低被封概率）
  max_items_per_source: 60     # 单源单次最多取多少条（源变多后单源上限放宽，总量更足）
  respect_robots: true         # 是否遵守 robots.txt
  # 抓取身份：使用标准浏览器标识，并按域名限速、遵守 robots.txt。
  # 部分站点对自动化请求较敏感（会对非浏览器标识直接返回 403），
  # 因此统一采用浏览器标识，访问频率保持在人工浏览的量级（见上面的 min/max_delay）。
  # 长期返回 403/挑战页的源按"源失效"处理，由健康检查告警，不在这里做特殊处理。
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/124.0 Safari/537.36
  # 纯导流站/内容农场，来自 GDELT 这类聚合检索时会把它们带进来。
  # 想屏蔽更多站，往这里加域名即可（匹配 original_url 子串）。
  deny_domains:
    - dailypolitical.com
    - mtltimes.ca

llm:
  # 默认智谱 GLM-4.7-Flash（2026-10 官方 free 分类，模型编码 glm-4.7-flash，200K 上下文）
  # 备选 DeepSeek：base_url https://api.deepseek.com  model deepseek-v4-flash
  provider: zhipu
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4.7-flash
  # 免费池降级链。实测（2026-10）glm-4.7-flash 高峰期整池返回 1305「该模型当前访问量过大」，
  # 连 1 条 600 字的小请求都进不去、等满一分钟窗口仍然 429；而 glm-4-flash-250414
  # 连续 3 次全部成功且直接返回干净 JSON。所以主模型撞墙就自动换下面这几个。
  model_fallbacks:
    - glm-4-flash-250414
    - glm-4-air-250414
  api_key_env: ZHIPU_API_KEY   # 只读环境变量 / 本地 .env，绝不写进代码
  batch_size: 5                # 每批送几条给模型（摘要写长了，批次相应调小，免得单次请求过大）
  temperature: 0.2
  timeout_seconds: 90
  retries: 3                   # 429（免费池拥塞）时按 12s/24s/48s 退避重试
  max_wall_seconds: 1020       # 模型阶段最多花 17 分钟（对应 workflow 的 28 分钟上限）
  batch_gap_seconds: 1.5       # 批次之间歇一下，免费池更容易过
  max_summary_chars: 220       # 摘要硬上限（列表只显示前两行，详情页读全段）
  target_summary_chars: 180    # 模型写完若不足这个长度，用正文里的信息句补足
  min_summary_chars: 30
  disable_thinking: true       # GLM Flash 默认带思考，摘要任务关掉更省 token
  backfill_per_run: 60         # 每轮把多少条「正文截断」的旧摘要重写成中文概括（0=关闭）

extract:
  # HTML 列表页不给摘要时，抓详情页抽首段。零成本、不编造，默认开启。
  enabled: true
  min_chars: 40                # 短于此长度的段落不算正文
  summary_chars: 200           # 抽取摘要的展示上限（模型改写后按 llm.max_summary_chars 压到 220）
  body_chars: 2400             # 站内详情页展示的正文摘录长度（不存全文，避免整篇转载）
  body_backfill_per_run: 60    # 每轮给多少条老记录补正文摘录（详情页需要）
  max_per_run: 80              # 单轮最多抓多少篇详情页，防止首次运行太久
  backfill_per_run: 40         # 每轮回填多少条"库里已有但没有摘要"的旧条目
  workers: 4

relevance:
  # 关键词加权分阈值。分数算法见 pipeline/relevance.py：
  # 标题命中算 1.6 倍权重、正文命中算 0.5 倍；命中"奶粉/婴幼儿配方/infant formula"(5分)即过线，
  # 单命中"乳业/dairy"(3分)不够，需要再叠加事件类词。
  # 筛得太狠就调低到 3.5，混进太多无关内容就调到 5。Stage 2 接模型精筛后可放宽到 3.5。
  min_score: 4.0
  # 主题硬门槛：标题里必须出现"母婴人群/品类""跟踪品牌""奶粉供应链核心词"之一，
  # 否则不看分数直接丢。食品伙伴网、中国食品安全报、市场监管总局这类泛食品源
  # 的抽检/召回稿（进口腌芒果二氧化硫超标、出口烤花生不合格…）全靠它拦住。
  # 想临时放宽（比如想看泛食品召回）改成 false 即可，不用动代码。
  require_core_title: true

dedupe:
  title_similarity: 0.82       # 字符 bigram Jaccard 阈值
  window_days: 7               # 只和最近 N 天的数据比对
  max_per_event: 2             # 同一事件最多保留几条

pipeline:
  retention_days: 90
  max_age_days: 45             # 入库时丢弃发布时间早于 N 天的条目（品牌官网页脚常有陈年旧稿）
  max_per_source: 14           # 单源单轮最多入库多少条，防止一个站把信息流刷屏
  tags:
    - 品牌动态
    - 政策法规
    - 质量安全
    - 市场数据
    - 供应链
    - 跨境电商
    - 海外动态

output:
  latest_js_max_items: 100     # data/latest.js 只放最近 N 条（file:// 双击用）
