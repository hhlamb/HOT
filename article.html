<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>白鲸 · 跨境母婴奶粉情报</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
/* 深色模式必须在样式计算之前定下来。app.js 在 body 末尾才执行，
   放那里会让暗色用户每次刷新都先看一帧白屏。 */
try {
  if (localStorage.getItem("milkradar-theme") === "dark") {
    document.documentElement.dataset.theme = "dark";
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="shell">

  <aside class="rail">
    <a class="brand" href="./">
      <img class="mark" src="assets/logo.svg" alt="" width="27" height="27">
      <span class="brand-text">
        <span class="brand-cn">白鲸</span>
        <span class="brand-en">BELUGA</span>
      </span>
      <span class="brand-sub">跨境母婴 · 奶粉情报</span>
    </a>

    <!-- 手机报头右侧的深浅色开关（宽屏下隐藏，桌面用侧栏底部那个） -->
    <button class="icon-btn theme-float" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">☾</button>

    <div class="rail-group rail-nav">
      <div class="rail-label">浏览</div>
      <a class="nav-item nav-back" href="./">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4.5 6 10l5.5 5.5"/></svg>
        返回列表
      </a>
      <a class="nav-item" href="./?view=hot">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8s3.4 3 3.4 6a3.4 3.4 0 0 1-6.8 0c0-1.2.5-2.2 1.1-3 0 1.4.7 2.2 1.5 2.2.9 0 1.4-.8 1.4-2 0-1.2-.6-2.4-.6-3.2Z"/><path d="M4.6 11.4a7 7 0 1 0 10.8 0"/></svg>
        热点榜
      </a>
      <a class="nav-item" href="./?view=daily">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.4" width="14" height="12.2" rx="2.2"/><path d="M3 8.2h14M6.8 2.9v2.9M13.2 2.9v2.9"/></svg>
        日报
      </a>
    </div>


    <div class="rail-foot">
      <button class="icon-btn" id="theme-btn" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">☾</button>
    </div>
  </aside>

  <main class="main">
    <div class="inner">
      <article class="article" id="article" hidden>
        <div class="article-meta" id="a-meta"></div>
        <h1 id="a-title"></h1>
        <p class="article-title-en" id="a-title-en" hidden></p>

        <figure class="hero-img" id="a-hero" hidden>
          <img id="a-hero-img" alt="" referrerpolicy="no-referrer">
          <figcaption id="a-hero-cap"></figcaption>
        </figure>

        <div class="rule"></div>

        <section id="a-ai" hidden>
          <div class="section-label">AI 速览<span class="label-tag" id="a-ai-tag" hidden></span></div>
          <div class="ai-box" id="a-summary"></div>
          <ul class="ai-points" id="a-points" hidden></ul>
        </section>

        <section id="a-body-wrap" hidden>
          <div class="section-label" style="margin-top:26px">原文摘录</div>
          <div class="body-text" id="a-body"></div>
          <p class="body-note" id="a-body-note">以上为原文关键段落摘录，用于快速判断是否值得深读；完整内容请点下方原文按钮。</p>
        </section>

        <section id="a-timeline" hidden>
          <div class="section-label" style="margin-top:26px">事件脉络<span class="label-hint">同一分类的近期进展</span></div>
          <ol class="timeline-list" id="a-timeline-list"></ol>
        </section>

        <section id="a-facts-wrap" hidden>
          <div class="section-label" style="margin-top:26px">原文信息</div>
          <dl class="facts" id="a-facts"></dl>
        </section>

        <div class="rule"></div>

        <div class="origin" id="a-origin-box">
          <div class="origin-text" id="a-origin-text">出处 · 原媒体</div>
          <a class="btn-primary" id="a-origin" href="#" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>
        </div>
      </article>

      <p id="status" class="status">正在读取文章…</p>

      <section class="extend" id="related" hidden>
        <div class="section-label">相关阅读</div>
        <div id="related-list"></div>
      </section>

      <section class="extend" id="extend" hidden>
        <div class="section-label" id="extend-label">延伸阅读</div>
        <div class="extend-list" id="extend-list"></div>
      </section>

      <footer class="site-footer">
        <p>白鲸是个人自用的行业信息聚合，仅呈现标题、摘要与原文摘录，版权归原媒体所有；每篇均标注出处并提供原文链接。摘要由 AI 归纳，仅供参考，细节以原文为准；配图版权归原发布方。</p>
      </footer>
    </div>
  </main>
</div>

<script src="assets/feed-data.js"></script>
<script src="assets/article.js"></script>
</body>
</html>
