<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 个人聚合站，不希望被搜索引擎收录 -->
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="description" content="跨境母婴与婴幼儿配方奶粉的行业情报雷达：监管通告、品牌动态、质量召回、供应链与跨境电商政策，每 4 小时自动更新。">
<title>白鲸 · 跨境母婴奶粉情报</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
/* 深色模式必须在样式计算之前定下来。app.js 在 body 末尾才执行，
   放那里会让暗色用户每次刷新都先看一帧白屏。 */
try {
  if (localStorage.getItem("milkradar-theme") === "dark") {
    document.documentElement.dataset.theme = "dark";
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="shell">

  <!-- ==================== 左侧竖栏 ==================== -->
  <aside class="rail" id="rail">
    <a class="brand" href="./">
      <img class="mark" src="assets/logo.svg" alt="" width="28" height="28">
      <span class="brand-text">
        <span class="brand-cn">白鲸</span>
        <span class="brand-en">BELUGA</span>
      </span>
      <span class="brand-sub">跨境母婴 · 奶粉情报</span>
    </a>

    <!-- 手机报头右侧的深浅色开关。桌面端靠侧栏底部那个 #theme-btn，
         这个按钮在宽屏下 display:none，只有 ≤860px 才出现。 -->
    <button class="icon-btn theme-float" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">☾</button>

    <div class="rail-group rail-nav">
      <div class="rail-label">内容</div>
      <button class="nav-item" type="button" data-view="pick">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2.6 12.3 7.4l5.2.66-3.85 3.6.99 5.14L10 14.28l-4.64 2.52.99-5.14L2.5 8.06l5.2-.66Z"/></svg>
        精选
        <span class="n" id="n-pick"></span>
      </button>
      <button class="nav-item" type="button" data-view="all">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/></svg>
        全部动态
        <span class="n" id="n-all"></span>
      </button>
      <button class="nav-item" type="button" data-view="hot">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8s3.4 3 3.4 6a3.4 3.4 0 0 1-6.8 0c0-1.2.5-2.2 1.1-3 0 1.4.7 2.2 1.5 2.2.9 0 1.4-.8 1.4-2 0-1.2-.6-2.4-.6-3.2Z"/><path d="M4.6 11.4a7 7 0 1 0 10.8 0"/></svg>
        热点榜
        <span class="n" id="n-hot"></span>
      </button>
      <button class="nav-item" type="button" data-view="daily">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.4" width="14" height="12.2" rx="2.2"/><path d="M3 8.2h14M6.8 2.9v2.9M13.2 2.9v2.9"/></svg>
        日报
        <span class="n" id="n-daily"></span>
      </button>
    </div>

    <div class="rail-sep"></div>

    <div class="rail-group" id="rail-cats">
      <div class="rail-label">分类</div>
      <div class="cat-list" id="cats"></div>
    </div>

    <div class="rail-foot">
      <div class="rail-stat" id="rail-stat"></div>
      <button class="icon-btn" id="theme-btn" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">☾</button>
    </div>
  </aside>

  <!-- ==================== 内容区 ==================== -->
  <main class="main">
    <div class="inner">

      <!-- 第一层 · 状态：这一屏是什么时候的、有多少东西 -->
      <header class="hd">
        <div class="hd-main">
          <h1 class="h1" id="page-title">精选</h1>
          <p class="hd-s" id="live"></p>
        </div>
        <label class="searchbox">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="8.6" cy="8.6" r="5.4"/><path d="M12.7 12.7 16.5 16.5" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="搜索标题、摘要或来源" autocomplete="off" spellcheck="false" aria-label="搜索资讯">
        </label>
        <!-- 手机上搜索框默认收起，藏在这枚按钮后面：搜索是低频动作，
             常驻一整行会白白吃掉首屏四十多像素 -->
        <button class="search-mini" type="button" id="search-mini" aria-label="搜索" aria-expanded="false">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="8.6" cy="8.6" r="5.4"/><path d="M12.7 12.7 16.5 16.5" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <!-- 第二层 · 判断：一个头条 + 四条要闻（仅精选页） -->
      <div class="board" id="board" hidden></div>

      <!-- 分类筛选：只在「全部动态」出现。手机上侧栏收成顶栏、分类行让位给它，
           所以这一行在窄屏是唯一的筛选入口；桌面和侧栏共用同一份 state.tag，
           点哪边都同步。 -->
      <div class="filters" id="filters" hidden></div>

      <!-- 第三层 · 记录：时间脊 + 条目 -->
      <div id="view" aria-live="polite"></div>

      <p id="status" class="status">正在读取数据…</p>
      <button id="more-btn" class="more-btn" type="button" hidden>加载更多</button>

      <footer class="site-footer">
        <p>白鲸是个人自用的行业信息聚合，仅呈现标题、摘要、要点与原文摘录，版权归原媒体所有；每篇均标注出处并提供原文链接。摘要由 AI 归纳，仅供参考，细节以原文为准；配图版权归原发布方。</p>
      </footer>

    </div>
  </main>
</div>

<script src="assets/feed-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
