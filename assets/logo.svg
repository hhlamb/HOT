<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="白鲸">
  <title>白鲸</title>
  <rect width="32" height="32" rx="8" fill="#0e5b4f"/>
  <g transform="matrix(.94 0 0 .94 .584 .644)">
    <!-- 身体：圆额隆、无背鳍（白鲸没有背鳍，这是它跟鱼最大的区别） -->
    <ellipse cx="13.4" cy="17.6" rx="9.5" ry="7.1" fill="#fff"/>
    <!-- 尾叶：一片上翘的窄叶，不做上下分叉——分叉就是鱼尾 -->
    <path d="M20.6 16.2C23.4 13 26.2 10.8 28.6 9.4c.8-.4 1.4.4 1 1.2-1.8 3.4-3.7 7-5 10.4-.4 1.1-1.8 1-2.1-.1-.4-1.7-1-3.3-1.9-4.7Z" fill="#fff"/>
    <!-- 眼：在头侧偏下，不是鱼那种贴着吻端的大圆眼 -->
    <circle cx="8.4" cy="18.6" r="1.2" fill="#0e5b4f"/>
  </g>
</svg>
