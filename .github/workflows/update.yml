name: update-feed

# 每 2 小时跑一次抓取，然后就地部署。
# 关键设计（都是踩过坑才这么写的）：
#   1. 抓取和部署放在同一个 workflow 里。用 GITHUB_TOKEN 推送的提交不会触发新的
#      workflow（GitHub 防止递归触发），所以"提交→另一个 workflow 部署"这条路走不通。
#   2. cron 用 17 分而不是 0 分：整点是 GitHub 的调度高峰，延迟最严重；也顺带避开
#      目标站的整点采集习惯。间隔 2 小时是按"当天突发能当天上榜"定的：
#      原来 4 小时一轮，上午发生的事要等到下一轮才进库，热点榜就慢半拍。
#   3. concurrency 的 cancel-in-progress 必须是 false：true 会在 git commit 中途
#      杀掉上一次运行，可能留下 index 与 .git 不一致的半状态。
#   4. timeout-minutes 必须设：某次运行卡死会让 concurrency 队列被永久占住，
#      后面的定时任务全部阻塞。
#   5. checkout 用 fetch-depth: 1：仓库历史再大也不影响 CI，浅克隆省时间。
#   6. 单轮通常 10~15 分钟，2 小时间隔留足余量；公网仓库的 Actions 不计量额度。

on:
  schedule:
    # UTC。+8 后对应北京时间 01:17 / 03:17 / 05:17 … 23:17，每两小时一轮
    - cron: "17 */2 * * *"
  workflow_dispatch: {}   # 手动触发入口，方便第一次跑通和临时补抓
  # 改了代码就自动跑一次，省得每次手工点 Run workflow。
  # data/** 必须排除：build job 自己会提交数据，若不排除就会自己触发自己（死循环）。
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "meta/**"
      - "**.md"
      # 诊断脚本和诊断工作流专属，改它们不该顺带跑一遍 15 分钟的完整抓取
      - "scripts/diag_*.py"
      - ".github/workflows/diag-*.yml"

permissions:
  contents: write        # 提交抓取结果
  pages: write           # 部署 Pages
  id-token: write        # deploy-pages 需要 OIDC

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 源从 32 个扩到 42 个、正文摘录从 800 字扩到 2400 字，单轮抓取量翻倍，
    # 20 分钟开始吃紧。上限提到 28 分钟，同时 llm 内部有 12 分钟时间预算兜底。
    timeout-minutes: 28
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 检出代码（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 改样式、改页面根本不需要重新抓一遍新闻，但抓取和部署绑在同一个 run 里，
      # 以前改一个字号也得陪着跑 9 分钟的抓取。这里先看这轮 push 改了什么：
      # 只碰前端文件就跳过抓取，直接打包部署（约 2 分钟）；只要沾了抓取逻辑、
      # 数据或配置，就老老实实全跑。定时的和手动触发的一律全跑。
      - name: 判断这轮要不要抓新闻
        id: gate
        run: |
          need="true"
          base="${{ github.event.before }}"
          head="${{ github.event.after }}"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "非 push 触发（定时/手动），照常抓取"
          elif [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "拿不到上一版提交（首次或强推），按需要抓取处理"
          else
            # 浅克隆只有 head 一个提交，把 base 单独拉下来才能 diff
            git fetch --depth=1 origin "$base" >/dev/null 2>&1 || true
            changed=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
            if [ -z "$changed" ]; then
              echo "取不到改动清单，按需要抓取处理"
            else
              echo "本轮改动："
              echo "$changed" | sed 's/^/  - /'
              # 白名单之外只要有一个文件，就得跑完整抓取
              outside=$(echo "$changed" | grep -vE '^(assets/|index\.html$|article\.html$|scripts/build_site\.py$|robots\.txt$)' || true)
              if [ -z "$outside" ]; then
                need="false"
                echo "只动了前端，跳过抓取"
              else
                echo "动到了抓取/数据/配置，走完整流程"
              fi
            fi
          fi
          echo "need_fetch=$need" >> "$GITHUB_OUTPUT"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 + 清洗 + 摘要
        if: steps.gate.outputs.need_fetch != 'false'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/run.py

      - name: 提交数据（无变化则跳过）
        id: commit
        if: steps.gate.outputs.need_fetch != 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本轮没有新增内容，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update feed $(date -u +'%Y-%m-%dT%H:%MZ')"
          # 抓取跑了十几分钟，期间 main 可能已经被别的提交推前了，直接 push 会被拒。
          # 只 rebase 代码冲突不会发生，但 data/*.jsonl 一定会——两个 run 同时往同一个
          # 月分片里追加内容时，逐行合并必然打架。数据是 append-only，丢掉的那几条
          # 下一轮还能抓回来，所以冲突时保留本地这一轮，别整轮白跑。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # rebase 冲突：data/ 取本地（--theirs 在 rebase 里指"正在应用的那个提交"）
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git checkout --theirs -- data/ 2>/dev/null || true
              git add data/
              GIT_EDITOR=true git rebase --continue || git rebase --skip || true
              if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ] && git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "推送冲突，第 $i 次重试…"
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::推送失败，本轮数据未提交"
          exit 1

      # 公开仓库连续 60 天没有提交，schedule 会被 GitHub 自动停用（很隐蔽的坑）。
      # 只在「7 天没有数据提交」时补一次心跳；内容恒定，内容不变就不会产生新 blob。
      - name: 心跳（防 60 天静默停更）
        if: steps.gate.outputs.need_fetch != 'false'
        run: |
          mkdir -p meta
          last=$(git log -1 --format=%ct -- data/ || echo 0)
          now=$(date -u +%s)
          if [ $(( (now - last) / 86400 )) -ge 7 ]; then
            echo "alive" > meta/heartbeat.txt
            git add meta/heartbeat.txt
            git diff --cached --quiet || git commit -m "chore: keepalive" && git push || true
          fi

      - name: 准备站点目录
        run: |
          python scripts/build_site.py
          du -sh _site

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 这个 environment 必须声明，否则 deploy-pages 会报 "environment not found"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
