  # ---------- F2. 点名跟踪的三个品牌（2026-10-28 增补）----------
  # 羊神点名要跟：Harker Herbals（哈克草本，新西兰草本口服液）、
  # Cenovis（萃益维，赛诺菲旗下澳洲维生素）、Friso（美素佳儿，菲仕兰）。
  # 为什么不直接抓官网：harkerherbals.co.nz 与 friso.com.cn 国内直连不通，
  # cenovis.com.au 能打开但没有资讯列表（纯电商页），抓下来只有产品文案。
  #
  # 查询是实测调出来的，别随手改（scripts/diag_brand.py 是量这些数字的工具）：
  #   哈克草本：Google 中文版 0 条；英文名 + when:90d 有 8 条、近 45 天 1 条
  #   萃益维：中英港台四个索引都没有新稿（最后一篇 2026-02）→ 先挂着等新稿
  #   美素佳儿：裸查询会被 Google 排成 7 月旧闻（32 条全过期）；
  #             加 when:60d 后 37 条、近 45 天 20 条，才是"最新消息"
  - id: brand_harker
    name: Harker Herbals（哈克草本）
    url: >-
      https://news.google.com/rss/search?q=%E5%93%88%E5%85%8B%E8%8D%89%E6%9C%AC%20OR%20Harker%20Herbals%20when%3A90d&hl=en-US&gl=US&ceid=US:en
    type: rss
    lang: en
    priority: P1
    enabled: true
    note: 2026-10-28 接入。新西兰本地媒体用英文名，走美国英文版 + when:90d
    must_match:
      - 哈克草本
      - Harker Herbals
      - Harker

  - id: brand_cenovis
    name: Cenovis（萃益维）
    url: >-
      https://news.google.com/rss/search?q=%E8%90%83%E7%9B%8A%E7%BB%B4%20OR%20Cenovis&hl=zh-CN&gl=CN&ceid=CN:zh-Hans
    type: rss
    lang: zh
    priority: P1
    enabled: true
    note: 2026-10-28 接入。实测中英文索引近半年都没有新稿（最后一篇 2026-02-04），源先挂着，出稿自动进库
    must_match:
      - 萃益维
      - Cenovis

  - id: brand_friso
    name: Friso（美素佳儿）
    url: >-
      https://news.google.com/rss/search?q=%E7%BE%8E%E7%B4%A0%E4%BD%B3%E5%84%BF%20when%3A60d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans
    type: rss
    lang: zh
    priority: P0
    enabled: true
    note: 2026-10-28 接入。必须带 when:60d，否则 Google 按旧闻排序，抓回来全是 7 月的铅超标稿
    must_match:
      - 美素佳儿
      - Friso
      - 皇家美素佳儿

  # ---------- G. 用户指定的垂直媒体（2026-10-25 增补实测）----------
  - id: muyingqianyan
    name: 母婴前沿
    url: https://www.muyingqianyan.com/feed
    type: rss
    lang: zh
    priority: P0
    enabled: true
    note: 实测 WordPress 原生 RSS 可用（/feed，application/rss+xml）。垂直度高，品牌/渠道内幕报道多

  - id: cbiline
    name: 中童传媒
    url: https://www.cbiline.com/news/
    type: html
    lang: zh
    priority: P0
    enabled: true
    note: 无 RSS。列表页 li > a，标题在 .text_box h5。特殊之处：日期被拆成 h5=日、p=年、p=月，需 date_regex 重组
    selector: "ul li a"
    date_regex: '(?P<d>\d{1,2})\s+(?P<y>20\d{2})\s+(?P<m>\d{1,2})'

  - id: baobei360
    name: 中婴网
    url: https://www.baobei360.com/
    type: html
    lang: zh
    priority: P1
    enabled: true
    note: 无 RSS。文章 URL 里自带日期（/info/2026-10-09/…），可直接从 URL 取时间。首页含大量活动/广告位，靠关键词过滤
    url_must_include: 'baobei360\.com/(info|news|research|brand)/.*20\d{2}[-/]\d{2}'

  - id: ciferquery
    name: 进口食品境外生产企业注册查询
    url: https://ciferquery.singlewindow.cn/
    type: html
    lang: zh
    priority: P3
    enabled: false
    note: 海关"单一窗口"查询页，JS 动态渲染 + 需人机验证，无列表接口。实测 200 但页面无任何文章链接，抓取不可行

  # ---------- 替代源（2026-10-26 新增）----------
  # 政府站与品牌官网从境外抓不到，改用 Google News 的定向查询"借道"：
  # 它的索引里既有 gov.cn 的通告，也有媒体对雀巢/飞鹤的报道，且对 Actions 的 IP 友好。
  - id: gnews_cn_policy
    name: Google News·配方注册与监管（中文）
    url: >-
      https://news.google.com/rss/search?q=%E5%A9%B4%E5%B9%BC%E5%84%BF%E9%85%8D%E6%96%B9%E4%B9%B3%E7%B2%89%20(%E6%B3%A8%E5%86%8C%20OR%20%E5%9B%BD%E6%A0%87%20OR%20%E6%96%B0%E8%A7%84%20OR%20%E7%9B%91%E7%AE%A1%20OR%20%E6%8A%BD%E6%A3%80)&hl=zh-CN&gl=CN&ceid=CN:zh-Hans
    type: rss
    lang: zh
    priority: P0
    enabled: true
    note: 替代 gov.cn / 卫健委。链接为 Google 跳转，正文抽取成功率低，但标题+摘要足够定位政策变动

  - id: gnews_cn_crossborder
